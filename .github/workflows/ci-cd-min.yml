name: ci-cd-min
on:
  workflow_call:
    inputs:
      app_type:
        type: string
        required: true
      deploy_in_workflow:
        type: boolean
        default: true
jobs:
  pr-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR source for main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD" == "dev" || "$HEAD" == release/* || "$HEAD" == hotfix/* ]]; then
            echo "allowed"
          else
            echo "::error::bad source"; exit 1
          fi
  quality-gate:
    uses: triarchsecurity/shared-workflows/.github/workflows/quality-gate.yml@release/v9
    with:
      run_qa_tests: false
      run_pentest: false
      needs_server: false
    secrets: inherit
