name: Quality Gate

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: '22'
      run_qa_tests:
        type: boolean
        default: true
      run_pentest:
        type: boolean
        default: true
      qa_runner_path:
        type: string
        default: 'tests/qa/runner-qa.js'
      pentest_runner_path:
        type: string
        default: 'tests/security/runner-pentest.js'
      master_runner_path:
        type: string
        default: 'tests/runner.js'
      server_port:
        type: string
        default: '3001'
      health_endpoint:
        type: string
        default: '/api/health'
      needs_server:
        type: boolean
        default: true
      needs_build:
        type: boolean
        default: true
      build_command:
        type: string
        default: 'npm run build'
        description: 'Build command (override for monorepos, e.g. "npm run build -w @scope/web").'
      run_security_scans:
        type: boolean
        default: true
        description: 'Run Semgrep + OSV-Scanner + Gitleaks (in parallel with the gate job)'
      conformance_enforce:
        type: boolean
        default: false
        description: 'CONF-01..05 assertions. false => ::warning:: only (warn-first); true => ::error:: + fail. DO NOT flip in this phase.'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  packages: read
  contents: read

jobs:
  gate:
    name: Build, Test, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Secrets are passed via `secrets: inherit` from the caller.
    # Any secret set on the calling repo (or inherited from the org) is
    # available here. Empty/missing secrets evaluate to empty string (safe).
    #
    # v7: NODE_AUTH_TOKEN uses secrets.GITHUB_TOKEN (per-run auto-minted
    # repo token). The consumer repo must be added to the npm package's
    # "Manage Actions access" list for this to work. v6's GitHub App token
    # path was abandoned — GitHub Packages npm registry has a legacy access
    # check that doesn't honor cross-repo App installation tokens despite
    # the App being installed on the source repo. Use GITHUB_TOKEN instead.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:${{ inputs.server_port }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      WEBSITE_GITHUB_REPO: ${{ secrets.WEBSITE_GITHUB_REPO }}
      PORTAL_JWT_SECRET: ${{ secrets.PORTAL_JWT_SECRET }}
      PORTAL_TOTP_ENCRYPTION_KEY: ${{ secrets.PORTAL_TOTP_ENCRYPTION_KEY }}
      API_BASE_URL: http://localhost:${{ inputs.server_port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --include=optional forces platform-specific optional native deps to install.
        # npm intermittently omits them (e.g. lightningcss-linux-x64-gnu, the Tailwind v4 /
        # Turbopack binary), causing flaky "Cannot find module '../lightningcss.linux-x64-gnu.node'"
        # build failures. Belt-and-suspenders: rebuild the native module if it's still missing.
        run: |
          npm ci --include=optional
          if [ -d node_modules/lightningcss ] && ! node -e "require('lightningcss')" 2>/dev/null; then
            echo "lightningcss native binary missing — rebuilding"; npm rebuild lightningcss
          fi

      - name: Build application
        if: inputs.needs_build
        env:
          BUILD_CMD: ${{ inputs.build_command }}
          # Raise Node's heap ceiling for next-build on hosted runners (7GB RAM). Atlas hit
          # deterministic "Ineffective mark-compacts near heap limit" OOMs at the default heap
          # once its bundle grew (4 failures on 2026-07-04). Additive headroom only — no
          # behavior change for repos that fit the default.
          NODE_OPTIONS: --max-old-space-size=5120
        run: bash -c "$BUILD_CMD"

      - name: Start server
        if: inputs.needs_server
        run: |
          PORT=${{ inputs.server_port }} npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://localhost:${{ inputs.server_port }}${{ inputs.health_endpoint }} > /dev/null 2>&1; then
              echo "Server ready after $((i * 2))s"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
          done
          echo "Server failed to start after 60 seconds"
          exit 1

      - name: Generate test auth token
        if: inputs.needs_server
        id: token
        run: |
          if [ -f scripts/generate-test-token.js ]; then
            TOKEN=$(node scripts/generate-test-token.js)
            echo "TEST_SESSION_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
            echo "Auth test token generated"
          else
            echo "No token generator found — skipping"
          fi

      - name: Run QA test suite
        if: inputs.run_qa_tests
        env:
          TEST_SESSION_TOKEN: ${{ steps.token.outputs.TEST_SESSION_TOKEN }}
          API_BASE_URL: http://localhost:${{ inputs.server_port }}
        run: node ${{ inputs.qa_runner_path }} 2>&1

      - name: Run penetration test suite
        if: inputs.run_pentest
        env:
          TEST_SESSION_TOKEN: ${{ steps.token.outputs.TEST_SESSION_TOKEN }}
          API_BASE_URL: http://localhost:${{ inputs.server_port }}
        run: node ${{ inputs.pentest_runner_path }} 2>&1

      - name: Run master test runner
        if: inputs.run_qa_tests
        env:
          TEST_SESSION_TOKEN: ${{ steps.token.outputs.TEST_SESSION_TOKEN }}
          API_BASE_URL: http://localhost:${{ inputs.server_port }}
        run: node ${{ inputs.master_runner_path }} 2>&1

      - name: npm security audit
        run: npm audit --audit-level=critical

      - name: Stop server
        if: always() && inputs.needs_server
        run: kill $SERVER_PID 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            tests/**/*.md
          retention-days: 30

  # --------------------------------------------------- gate checks: version-consistency + scans (v9.2)
  # COLLAPSED (v9.2): the former `version-consistency`, `semgrep`, `osv-scanner`, and `gitleaks`
  # JOBS are now sequential STEPS in this one `scans` job. GitHub bills per job rounded UP to a full
  # minute, so four ~10-30s jobs cost ~4 billed minutes; as one job they cost ~2. Semgrep also moved
  # OFF the `semgrep/semgrep:latest` Docker Hub container — its unauthenticated image pulls were
  # timing out and failing the job at *startup* (before any step ran, so the advisory
  # continue-on-error never applied) — ONTO a pip install from PyPI (reliable + cached).
  #
  # REQUIRED-CHECK MIGRATION: repos whose `main` protection required the four old contexts
  # (`ci-cd / quality-gate / {version-consistency,semgrep,osv-scanner,gitleaks}`) must swap them for
  # the single `ci-cd / quality-gate / scans` context, in lockstep with the release/v9 merge.
  # `ci-cd / pr-source` and `Build, Test, Audit` are unaffected.
  #
  # Posture preserved EXACTLY:
  #   - version-consistency is BLOCKING (fails the job on drift) and ALWAYS runs.
  #   - semgrep / osv-scanner / gitleaks are ADVISORY (continue-on-error; findings surface in the
  #     log + step summary, never fail the job) and run only when run_security_scans is true (the
  #     dev path — skipped on main pushes and dev->main PRs, identical to before).
  scans:
    name: scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks history scan + semgrep --baseline-ref need full history

      # ---- version-consistency (BLOCKING gate, ~5s; always runs) ----
      - name: package.json ↔ package-lock.json version match
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json at repo root — skipping (this isn't a Node project)."
            exit 0
          fi
          PJ=$(node -p "require('./package.json').version" 2>/dev/null)
          if [ -z "$PJ" ]; then echo "::error::Could not read package.json version"; exit 1; fi
          if [ -f package-lock.json ]; then
            PL_TOP=$(node -p "require('./package-lock.json').version" 2>/dev/null)
            PL_PKG=$(node -p "require('./package-lock.json').packages[''].version || ''" 2>/dev/null)
            if [ "$PJ" != "$PL_TOP" ] || [ "$PJ" != "$PL_PKG" ]; then
              echo "::error::Version mismatch detected:"
              echo "::error::  package.json version           = $PJ"
              echo "::error::  package-lock.json .version     = $PL_TOP"
              echo "::error::  package-lock.json packages[''] = $PL_PKG"
              echo "::error::Fix: run 'npm install' locally and commit the updated package-lock.json."
              exit 1
            fi
            echo "package.json ($PJ) and package-lock.json are in sync."
          else
            echo "No package-lock.json at root — skipping lockfile check."
          fi
      - name: package.json ↔ src/lib/version.ts match (if version.ts exists)
        run: |
          if [ ! -f src/lib/version.ts ]; then
            echo "No src/lib/version.ts — skipping version.ts check."
            exit 0
          fi
          PJ=$(node -p "require('./package.json').version" 2>/dev/null)
          VT_RAW=$(grep -oE "['\"]v?[0-9]+\.[0-9]+\.[0-9]+['\"]" src/lib/version.ts | head -1 | tr -d "'\"")
          VT="${VT_RAW#v}"
          if [ -z "$VT" ]; then
            echo "::warning::Could not extract a semver from src/lib/version.ts — skipping. Pattern expected: 'vX.Y.Z' or 'X.Y.Z'."
            exit 0
          fi
          if [ "$PJ" != "$VT" ]; then
            echo "::error::Version mismatch detected:"
            echo "::error::  package.json version  = $PJ"
            echo "::error::  src/lib/version.ts    = $VT"
            echo "::error::Fix: update src/lib/version.ts so the version constant matches package.json."
            exit 1
          fi
          echo "package.json ($PJ) and src/lib/version.ts are in sync."

      # ---- semgrep (ADVISORY; pip-installed — no Docker Hub dependency) ----
      - name: Set up Python for semgrep
        if: inputs.run_security_scans
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip downloads (semgrep wheels)
        if: inputs.run_security_scans
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-py312
      - name: Semgrep diff scan (PR) / full scan (push)
        if: inputs.run_security_scans
        # ADVISORY: continue-on-error keeps the job green; findings surface as a warning + summary.
        continue-on-error: true
        # SECURITY: github.base_ref via env: + quoted shell var, not direct ${{ }} interpolation
        # (avoids run-shell-injection per Semgrep rule yaml.github-actions.security.run-shell-injection).
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --quiet semgrep
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            semgrep ci \
              --config p/ci \
              --config p/owasp-top-ten \
              --config p/react \
              --config p/typescript \
              --config p/javascript \
              --config p/nodejs \
              --config p/secrets \
              --baseline-ref "origin/$GH_BASE_REF" \
              --json --output=semgrep.json || true
          else
            semgrep ci \
              --config p/ci \
              --config p/owasp-top-ten \
              --json --output=semgrep.json || true
          fi
          if [[ -f semgrep.json ]]; then
            high=$(jq '[.results[] | select(.extra.severity=="ERROR" or .extra.severity=="WARNING")] | length' semgrep.json)
            if [[ "$high" -gt 0 ]]; then
              echo "::warning::Semgrep found $high Critical/High findings (advisory — not blocking deploy)"
              jq '.results[] | select(.extra.severity=="ERROR" or .extra.severity=="WARNING") | {check_id, path, message: .extra.message}' semgrep.json
              {
                echo "## Semgrep Findings ($high Critical/High)"
                echo ""
                echo "Findings are advisory and do not block deploy. Triage in a separate PR."
                echo ""
                jq -r '.results[] | select(.extra.severity=="ERROR" or .extra.severity=="WARNING") | "- `\(.check_id)` in `\(.path)`: \(.extra.message | gsub("\n"; " "))"' semgrep.json
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no Critical/High findings"
            fi
          fi

      # ---- osv-scanner (ADVISORY) ----
      - name: Run OSV-Scanner
        if: inputs.run_security_scans
        # google/osv-scanner-action is a monorepo; sub-action lives in /osv-scanner-action.
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5   # TODO: pin to commit SHA
        with:
          scan-args: |-
            --recursive
            --format=json
            --output=osv.json
            ./
        continue-on-error: true   # known vulns surface but don't block; Dependabot is the remediation channel
      - name: Summarize OSV findings
        if: always() && inputs.run_security_scans
        run: |
          if [[ -f osv.json ]]; then
            count=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv.json 2>/dev/null || echo 0)
            echo "OSV-Scanner found $count vulnerable package versions (see Dependabot for remediation)"
            jq -r '.results[]?.packages[]? | "  \(.package.name)@\(.package.version): \([.vulnerabilities[].id] | join(\",\"))"' osv.json 2>/dev/null | head -30 || true
          fi

      # ---- gitleaks (ADVISORY; binary, Action requires a paid org license) ----
      - name: Install gitleaks
        if: inputs.run_security_scans
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Run gitleaks (PR diff or full repo scan, advisory)
        if: inputs.run_security_scans
        continue-on-error: true
        # SECURITY: github.base_ref + event_name via env: + quoted shell vars (avoids run-shell-injection).
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            CONFIG_ARG=""
            [ -f .gitleaks.toml ] && CONFIG_ARG="--config=.gitleaks.toml"
            gitleaks protect --source=. --redact $CONFIG_ARG \
              --log-opts="--no-merges origin/$GH_BASE_REF..HEAD"
          else
            CONFIG_ARG=""
            [ -f .gitleaks.toml ] && CONFIG_ARG="--config=.gitleaks.toml"
            gitleaks detect --source=. --redact $CONFIG_ARG
          fi
          rc=$?
          if [[ $rc -eq 1 ]]; then
            echo "::warning::gitleaks found one or more secrets (advisory — not blocking deploy)"
            {
              echo "## Gitleaks Findings"
              echo ""
              echo "Findings are advisory and do not block deploy. Triage in a separate PR — rotate any real secrets, allowlist false positives in \`.gitleaks.toml\`."
              echo ""
              echo "See the workflow log above for redacted finding details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "scan complete"

  # -------------------------------------------------------- CI/infra conformance (CONF-01..05, warn-first)
  # Rides along on EVERY thin-caller PR. The checkers are single-homed in shared-workflows
  # (AR#5 rule 2 / CONF-05) — they are NEVER copied into the caller. This job checks out the
  # caller's tree AND the shared-workflows checker into `_conformance`, then runs the checker
  # against the caller's workspace.
  #
  # WARN-FIRST: `conformance_enforce` defaults false, so findings are ::warning:: only and the
  # job stays green (exit 0). The enforce flip (=> ::error:: + exit 1) is a SEPARATE future PR
  # after an observation window — do NOT set conformance_enforce=true from any ci-cd.yml yet.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Checkout shared-workflows checker
        uses: actions/checkout@v4
        with:
          repository: triarchsecurity/shared-workflows
          ref: release/v9
          path: _conformance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install checker deps
        run: cd _conformance/.github/conformance && npm ci

      - name: CI/infra conformance assertions (warn-first)
        env:
          ENFORCE: ${{ inputs.conformance_enforce }}
        run: node _conformance/.github/conformance/check-all.mjs --target "$GITHUB_WORKSPACE"
