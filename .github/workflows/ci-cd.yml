name: ci-cd

# ============================================================================
# CANONICAL Triarch CI/CD pipeline. ONE workflow every repo calls.
#
# Design: docs/ci-cd-canonical.md (and the 2026-05-31 consolidation design).
# Consumers reduce to a thin caller (triggers + this `uses:` + inputs + secrets).
# Everything that is a GATE is centralized here and is NOT optional, so a new
# repo cannot skip gating. Repo-specific values are inputs only.
#
# Internal composition pins sub-workflows at @release/v9 — the SAME moving ref
# consumers track — so the whole pipeline (this workflow + its sub-workflows)
# moves together, with no internal version drift (the F1 problem). A local `./`
# ref cannot be used here: GitHub rejects local reusable-workflow paths when the
# workflow is itself called cross-repo. Consumers track `release/v9`, so a change
# here propagates to all repos on their next run.
#
# Owner decisions baked in (2026-05-31):
#   - Security scans (semgrep/osv/gitleaks) run ONCE on the dev path, never on
#     the dev->main promotion (no duplication).
#   - QA + pentest run on PUSH events only (pre-deploy), never on every PR commit.
#
# app_type:
#   next-app  -> full quality-gate + build + dev/prod gating + FAH deploy + notify
#   static    -> quality-gate + build; deploy owned by FAH native integration
#                (set deploy_in_workflow:false)
#   mcp/lib/python -> ITERATION 2 (build/publish paths not yet centralized here;
#                     these repos stay on their current workflows until added).
# ============================================================================

on:
  workflow_call:
    inputs:
      app_type:
        description: 'next-app | static | mcp | lib | python'
        type: string
        required: true
      # --- identity ---
      project_key:
        description: 'CL-4 registry key in admin (projects.key). Required for next-app/static.'
        type: string
        required: false
        default: ''
      firebase_project_id:
        type: string
        required: false
        default: ''
      app_hosting_backend:
        description: 'PROD FAH backend id.'
        type: string
        required: false
        default: ''
      dev_backend:
        description: 'Explicit dev backend. Empty => auto-suffix <app_hosting_backend>-dev. Set for legacy repos (admin, darksouls).'
        type: string
        required: false
        default: ''
      # --- hostnames ---
      prod_url:
        type: string
        required: false
        default: ''
      dev_url:
        type: string
        required: false
        default: ''
      project_name:
        description: 'Human label for notifications.'
        type: string
        required: false
        default: ''
      # --- build / capability toggles ---
      node_version:
        type: string
        default: '22'
      build_command:
        description: 'Build command override (monorepos), e.g. "npm run build -w @scope/web".'
        type: string
        default: 'npm run build'
      deploy_command:
        type: string
        default: 'apphosting'
      run_qa_tests:
        description: 'Run QA suite (push events only; ignored on PRs regardless).'
        type: boolean
        default: false
      run_pentest:
        type: boolean
        default: false
      needs_server:
        type: boolean
        default: false
      deploy_in_workflow:
        description: 'false => FAH native GitHub integration owns deploy (www). Skips in-workflow deploy jobs.'
        type: boolean
        default: true
      record_release:
        description: 'POST the deploy to admin release-logs (CL-4 source data).'
        type: boolean
        default: true
      db_check_command:
        description: 'Optional READ-ONLY DB drift check (e.g. "npm run db:check"). Empty => skipped. When set, it gates deploy. Must be read-only — never a migration (prod DATABASE_URL hazard).'
        type: string
        default: ''
      report_tests:
        description: >
          Emit test-run telemetry to the control plane from the vitest-report artifact quality-gate
          produced THIS run (no second suite run). Fires on pull_request only (where the gate runs
          tests); on push the gate skips tests so there is nothing to report — honest by design. No-ops
          cleanly where the artifact or the ingest secret is absent.
        type: boolean
        default: true
      test_command:
        description: >
          Repo-provided blocking vitest command forwarded to quality-gate (folds guard suites into the
          single gate runner). Empty => the gate's default unit lane.
        type: string
        default: ''
      tests_on_push:
        description: 'Forwarded to quality-gate: run tests on push events too (default false — PRs are the tested path).'
        type: boolean
        default: false
      dev_lane_test_command:
        description: >
          ONLY meaningful with asymmetric_lanes=true. The blocking vitest command the DEV lane
          (PR base=dev, and push-to-dev when tests_on_push) runs. Empty (the default) reproduces the
          pre-2026-08-08 behaviour EXACTLY — the DEV lane runs no tests — so every repo that does not
          set this is byte-for-byte unchanged.

          WHY IT EXISTS: asymmetric_lanes was adopted as a COST cut, and it blanks test_command on the
          DEV lane. But a feature->dev PR already pays for a full runner (npm ci + next build); adding a
          vitest STEP inside that already-running job costs seconds of wall clock and ZERO extra billed
          jobs, because GitHub bills by job. Measured in atlas on 2026-08-08: the folded suite step was
          38s inside a 4m26s gate job. Blanking it bought ~38s and cost every feature branch its only
          pre-merge correctness signal — six phases reached dev with build-only CI behind them, and one
          of those merges shipped an undefined CSS token to two live pages that the repo already had a
          passing test for. Set this to the same command as test_command (or a fast CI-safe subset) so a
          defect fails a check BEFORE it reaches dev instead of after it reaches prod.

          The PROD lane is untouched: it always runs test_command.
        type: string
        default: ''
      asymmetric_lanes:
        description: >
          Opt-in: bare-bones DEV lane (minimal PR-to-dev signal, deploy-only push-to-dev) + full robust
          gate on the PROD/customer lanes. When true the pipeline computes the lane from the event and
          passes branch-conditional values to quality-gate: DEV lane (PR base=dev or push to dev) skips
          QA/pentest/security-scans/folded-tests/conformance and (on push) the build — FAH builds server
          side; PROD lane (PR base=main or push to main) runs the full robust posture unchanged. Other
          repos leave this false => behavior is byte-for-byte identical to the plain overhaul.
        type: boolean
        default: false
      single_lane:
        description: >
          Opt-in: ONE deployable branch (main). Skips the two jobs that exist only to enforce the
          three-branch promotion chain — `pr-source` (main may only receive PRs from dev, release/*
          or hotfix/*) and `verify-dev-deployed` (the dev-must-deploy-first ancestry check). Nothing
          else changes: quality-gate, security scans, version-consistency, cl4-gate, record-release
          and the prod `environment:` binding all still run on the prod lane.

          WHY IT EXISTS. Those two gates protect CUSTOMERS from a bad prod deploy by forcing every
          change through a soak environment first. A repo with no customers pays for that protection
          in run COUNT: measured in atlas on 2026-08-16, ONE change cost FIVE runs (feature->dev PR,
          push-to-dev, dev->main PR, review gate, push-to-main), at 54 runs in a single day. Per-run
          duration was already fine at 4-6 min — the promotion chain itself was the cost.

          It also removes a failure mode the chain creates. atlas-dev reported a successful "deploy
          to dev" on every dev push while producing NO rollout for five days, so the soak environment
          served stale code and laundered that staleness as verification. An environment nobody is
          genuinely promoting through is worse than no environment at all.

          Default false => every non-adopting repo renders byte-for-byte the same job set as before.
          Flipping it back restores the promotion chain exactly; nothing here is one-way.
        type: boolean
        default: false

concurrency:
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: read

jobs:
  # --- GATE: PR-source enforcement (centralized; was per-repo enforce-pr-source) -
  # Main may only receive PRs from dev / release/* / hotfix/*. Triggers on edited
  # so a base-branch retarget is re-checked (review gap C6).
  pr-source:
    if: ${{ !inputs.single_lane && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR source for main
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD" == "dev" || "$HEAD" == release/* || "$HEAD" == hotfix/* ]]; then
            echo "PR into main from '$HEAD' — allowed."
          else
            echo "::error::PRs into main must come from dev, release/*, or hotfix/* (got '$HEAD')."
            exit 1
          fi

  # --- GATE: build + scans + (push-only) QA/pentest -----------------------------
  # Default (asymmetric_lanes=false): security scans run on the dev path only (skip main push + PR->main).
  # Opt-in (asymmetric_lanes=true): the expensive suites INVERT to the PROD lane so the DEV lane is
  # bare-bones. The lane is computed inline from the event; asymmetric_lanes is ALSO forwarded so the
  # gate can skip whole jobs (scans/conformance) on the dev lane — job count, not step count, is what
  # GitHub bills. Every expression collapses to the original overhaul value when asymmetric_lanes=false.
  quality-gate:
    uses: triarchsecurity/shared-workflows/.github/workflows/quality-gate.yml@release/v9
    with:
      node_version: ${{ inputs.node_version }}
      # DEV-lane push is deploy-only (FAH builds server side) => no build; every other case builds.
      needs_build: ${{ !(inputs.asymmetric_lanes && github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
      build_command: ${{ inputs.build_command }}
      needs_server: ${{ inputs.needs_server && github.event_name == 'push' }}
      # QA/pentest: push-only always; under asymmetric_lanes, PROD-push (main) only.
      run_qa_tests: ${{ inputs.run_qa_tests && github.event_name == 'push' && (!inputs.asymmetric_lanes || github.ref == 'refs/heads/main') }}
      run_pentest: ${{ inputs.run_pentest && github.event_name == 'push' && (!inputs.asymmetric_lanes || github.ref == 'refs/heads/main') }}
      # Scans: default = dev path (not main). Asymmetric = PROD lane (main) only.
      run_security_scans: ${{ inputs.asymmetric_lanes && (github.ref == 'refs/heads/main' || github.base_ref == 'main') || (!inputs.asymmetric_lanes && !(github.ref == 'refs/heads/main' || github.base_ref == 'main')) }}
      # Folded guard suites: run on the PROD lane (or always when not asymmetric); blanked on the DEV lane.
      # PROD lane (or non-asymmetric) => test_command. DEV lane => dev_lane_test_command, which
      # defaults to '' — the previous behaviour — so this is a no-op for every repo that leaves it unset.
      test_command: ${{ (!inputs.asymmetric_lanes || github.base_ref == 'main' || github.ref == 'refs/heads/main') && inputs.test_command || inputs.dev_lane_test_command }}
      tests_on_push: ${{ inputs.tests_on_push }}
      # Forwarded so the gate can skip the scans + conformance JOBS on the DEV lane (default false = no-op).
      asymmetric_lanes: ${{ inputs.asymmetric_lanes }}
    secrets: inherit

  # --- report-tests: control-plane test telemetry from THIS run's vitest-report artifact ---------
  # Replaces the standalone per-repo test-telemetry workflow that RE-RAN the whole suite on every dev
  # push (~7.5 billed min/push). The gate already ran vitest at PR time and uploaded `vitest-report`;
  # this job just downloads that artifact and POSTs the derived payload — NO second suite run.
  # PR-only: on push the gate skips tests (tests_on_push=false), so there is no artifact to report.
  # always() so a RED gate still reports its results (RED is the truth). No-ops cleanly (::notice::)
  # when the artifact is absent (docs-only PR, or a repo that sets no test_command) or the ingest
  # secret is unset — safe to leave on for every consumer repo.
  # A DEV-lane PR runs folded tests only when dev_lane_test_command is set; when it is unset there is no
  # vitest-report to telemetry, so skip the job entirely (unchanged for every repo that leaves it unset).
  report-tests:
    needs: [quality-gate]
    if: always() && inputs.report_tests && github.event_name == 'pull_request' && !(inputs.asymmetric_lanes && github.base_ref == 'dev' && inputs.dev_lane_test_command == '')
    uses: triarchsecurity/shared-workflows/.github/workflows/test-telemetry.yml@release/v9
    with:
      report_artifact: vitest-report
    secrets: inherit

  # --- env-select: branch -> environment + backend (internalized) ---------------
  env-select:
    needs: quality-gate
    if: inputs.deploy_in_workflow && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.env }}
      backend: ${{ steps.pick.outputs.backend }}
    steps:
      - id: pick
        env:
          REF: ${{ github.ref }}
          PROD_BACKEND: ${{ inputs.app_hosting_backend }}
          DEV_BACKEND: ${{ inputs.dev_backend }}
        run: |
          if [ "$REF" = "refs/heads/dev" ]; then
            echo "env=dev" >> "$GITHUB_OUTPUT"
            if [ -n "$DEV_BACKEND" ]; then
              echo "backend=$DEV_BACKEND" >> "$GITHUB_OUTPUT"
            else
              echo "backend=${PROD_BACKEND}-dev" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "backend=$PROD_BACKEND" >> "$GITHUB_OUTPUT"
          fi

  # --- version: extract package.json version ONCE (internalized) ----------------
  # DEV-lane push (asymmetric): skipped — deploy-firebase extracts the version itself and exposes it
  # as the deploy job's output; notify falls back to that. deploy-dev's `always() && …` if does not
  # check this job's result, so skipping it does not block the deploy. Default false => unchanged.
  version:
    needs: quality-gate
    if: inputs.deploy_in_workflow && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !(inputs.asymmetric_lanes && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: extract
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -z "$VER" ]; then
            echo "::error::package.json version is empty"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VER"

  # --- GATE: optional read-only DB drift check (db_check_command set). Runs on
  #     PR + push so it gates both; deploy jobs require it (success-or-skipped). --
  db-check:
    needs: quality-gate
    if: inputs.db_check_command != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Run DB drift check (read-only)
        env:
          DB_CHECK_CMD: ${{ inputs.db_check_command }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash -c "$DB_CHECK_CMD"

  # --- GATE: dev-must-deploy-first ancestry check (prod only) -------------------
  verify-dev-deployed:
    needs: env-select
    if: ${{ !inputs.single_lane && needs.env-select.outputs.environment == 'prod' }}
    uses: triarchsecurity/shared-workflows/.github/workflows/verify-dev-deployed.yml@release/v9

  # --- GATE: CL-4 prod-version invariants (prod only). Centralized for ALL prod
  #     entrypoints so it cannot be bypassed (fixes truthtreason F3). ------------
  cl4-gate:
    needs: [env-select, version]
    if: needs.env-select.outputs.environment == 'prod'
    uses: triarchsecurity/shared-workflows/.github/workflows/gate-prod-version.yml@release/v9
    with:
      project_key: ${{ inputs.project_key }}
      target_version: ${{ needs.version.outputs.version }}
    secrets:
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}

  # --- GATE: GitHub Environment binding (prod only). No reviewer by default
  #     (preserves current behavior; opt-in approval via repo env settings). ----
  # `always()` + the explicit result checks (rather than a bare `if`) so this job still RUNS when
  # verify-dev-deployed is SKIPPED under single_lane. Without it, GitHub's default skip-cascade would
  # take the prod `environment:` binding down with the ancestry gate — and that binding is the one
  # prod guard single_lane deliberately KEEPS. env-select's own result is asserted so a genuine
  # upstream failure still stops here.
  gate-prod:
    needs: [env-select, verify-dev-deployed]
    if: |
      always() && needs.env-select.result == 'success' &&
      needs.env-select.outputs.environment == 'prod' &&
      (needs.verify-dev-deployed.result == 'success' || needs.verify-dev-deployed.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Production deploy approved for ${{ inputs.project_name }}."

  # --- deploy: dev ---------------------------------------------------------------
  deploy-dev:
    needs: [quality-gate, env-select, version, db-check]
    if: |
      always() && inputs.deploy_in_workflow &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      needs.quality-gate.result == 'success' && needs.env-select.result == 'success' &&
      (needs.db-check.result == 'success' || needs.db-check.result == 'skipped')
    uses: triarchsecurity/shared-workflows/.github/workflows/deploy-firebase.yml@release/v9
    with:
      firebase_project_id: ${{ inputs.firebase_project_id }}
      deploy_command: ${{ inputs.deploy_command }}
      app_hosting_backend: ${{ inputs.app_hosting_backend }}
      dev_backend: ${{ inputs.dev_backend }}
      app_url: ${{ inputs.dev_url }}
      environment: dev
      # Asymmetric DEV lane: fire-and-forget — create the rollout, don't burn the runner polling the
      # ~7-min server-side FAH build. Default (false) => true => blocking poll, unchanged.
      wait_for_rollout: ${{ !inputs.asymmetric_lanes }}
    secrets: inherit

  # --- deploy: prod --------------------------------------------------------------
  deploy-prod:
    needs: [quality-gate, version, env-select, verify-dev-deployed, gate-prod, cl4-gate, db-check]
    if: |
      always() && inputs.deploy_in_workflow &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success' &&
      needs.env-select.result == 'success' &&
      (needs.verify-dev-deployed.result == 'success' || needs.verify-dev-deployed.result == 'skipped') &&
      (needs.gate-prod.result == 'success' || needs.gate-prod.result == 'skipped') &&
      (needs.cl4-gate.result == 'success' || needs.cl4-gate.result == 'skipped') &&
      (needs.db-check.result == 'success' || needs.db-check.result == 'skipped')
    uses: triarchsecurity/shared-workflows/.github/workflows/deploy-firebase.yml@release/v9
    with:
      firebase_project_id: ${{ inputs.firebase_project_id }}
      deploy_command: ${{ inputs.deploy_command }}
      app_hosting_backend: ${{ inputs.app_hosting_backend }}
      app_url: ${{ inputs.prod_url }}
      environment: prod
      # Asymmetric PROD lane: fire-and-forget — create the rollout, don't burn the runner polling the
      # ~25-min server-side FAH build+rollout. Default (false) => true => blocking poll, unchanged. The
      # rollout still completes on FAH; prod-live is verified out-of-band (/api/health + cl4 pairing).
      wait_for_rollout: ${{ !inputs.asymmetric_lanes }}
    secrets: inherit

  # --- record-release: POST deploy to admin (CL-4 source data; internalized) ----
  # Runs on BOTH lanes now (2026-07-15 fix). It PREVIOUSLY skipped the asymmetric dev lane on the
  # theory that deploy-firebase posts the same /api/platform/ingest/release-logs endpoint in-job — but
  # that in-job record did NOT reliably land, so the admin snapshot's DEV version lagged, and the next
  # prod promotion's cl4-gate false-failed INV-2/INV-4 ("dev must deploy the exact target first"),
  # forcing a manual `apphosting:rollouts:create`. Running record-release as a proper TRACKED job on the
  # dev push guarantees the dev version records after a successful deploy-dev. The receiver upserts by
  # (project, version, env) so a duplicate POST is idempotent — safe if deploy-firebase also posts.
  #
  # 2026-07-16 fix: FAH-native repos (Firebase App Hosting deploys directly off the GitHub push, not the
  # CI deploy-dev/deploy-prod job) leave those jobs SKIPPED, never 'success'. The old guard required
  # 'success', so record-release SKIPPED on every FAH-native push → the admin snapshot never recorded a
  # dev version → cl4-gate INV-1 ("no dev release recorded") false-blocked EVERY prod promotion, forcing a
  # manual apphosting:rollouts:create each time (atlas, 2026-07-16). Fix: gate PER-LANE and record unless
  # that lane's deploy actively FAILED/was cancelled — so 'success' (CI-deploy) AND 'skipped' (FAH-native)
  # both record, while a real deploy failure still does not. (A branch-agnostic `|| deploy-prod == skipped`
  # would wrongly fire on a dev push, where deploy-prod is ALWAYS skipped, even if deploy-dev failed.)
  record-release:
    needs: [env-select, version, deploy-dev, deploy-prod]
    if: |
      always() && inputs.record_release && github.event_name == 'push' &&
      (
        (github.ref == 'refs/heads/dev' && needs.deploy-dev.result != 'failure' && needs.deploy-dev.result != 'cancelled') ||
        (github.ref == 'refs/heads/main' && needs.deploy-prod.result != 'failure' && needs.deploy-prod.result != 'cancelled')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: POST release to admin
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          ENV_NAME: ${{ needs.env-select.outputs.environment }}
          VERSION: ${{ needs.version.outputs.version }}
          PROJECT_KEY: ${{ inputs.project_key }}
          GH_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::warning::ADMIN_API_TOKEN not set — skipping release log POST"; exit 0
          fi
          BRANCH="${REF#refs/heads/}"
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.0$'; then RTYPE="minor"; else RTYPE="patch"; fi
          # project rides the payload for an explicit receiver cross-check; the receiver ALSO derives
          # it from the Bearer apiKey (2026-07-05 dual-auth fix — this POST had 401'd since v8: the
          # receiver only took x-ingest-secret, so release_logs stayed EMPTY for every repo).
          PAYLOAD=$(jq -n \
            --arg project "$PROJECT_KEY" \
            --arg version "v$VERSION" --arg releaseType "$RTYPE" --arg env "$ENV_NAME" \
            --arg commitSha "$GH_SHA" --arg deployedAt "$DEPLOYED_AT" --arg branch "$BRANCH" \
            --arg releasedBy "github-actions/${GITHUB_ACTOR}" \
            '{project:$project,version:$version,releaseType:$releaseType,env:$env,commitSha:$commitSha,deployedAt:$deployedAt,branch:$branch,releasedBy:$releasedBy}')
          # --retry + the "000" fallback: a mid-rollout blip (the receiving instance restarts as this
          # fires) must degrade to the warning path, never hard-fail the job (2026-07-05: curl exit 28).
          HTTP_CODE=$(curl -s --max-time 15 --retry 3 --retry-all-errors -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "https://crm.triarchsecurity.com/api/platform/ingest/release-logs" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD" || echo "000")
          BODY=$(head -c 400 /tmp/resp.txt 2>/dev/null || echo "")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✓ Release recorded (HTTP $HTTP_CODE): $BODY"
          else
            echo "::warning::Release log POST failed (HTTP $HTTP_CODE): $BODY — next prod cl4-gate will reflect drift."
          fi

  # --- notify: FAH rollout poll + Slack -----------------------------------------
  notify:
    needs: [quality-gate, env-select, version, deploy-dev, deploy-prod]
    if: always() && inputs.deploy_in_workflow && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    uses: triarchsecurity/shared-workflows/.github/workflows/notify.yml@release/v9
    with:
      status: ${{ needs.deploy-prod.result != 'skipped' && needs.deploy-prod.result || needs.deploy-dev.result }}
      # version job is skipped on the asymmetric DEV-lane push — fall back to the version the deploy
      # job itself extracted. When the version job ran, the first operand wins (unchanged behavior).
      version: ${{ needs.version.outputs.version || needs.deploy-dev.outputs.version }}
      project_name: ${{ inputs.project_name }} (${{ needs.env-select.outputs.environment }})
      app_url: ${{ needs.env-select.outputs.environment == 'prod' && inputs.prod_url || inputs.dev_url }}
      app_hosting_backend: ${{ needs.env-select.outputs.backend }}
      firebase_project_id: ${{ inputs.firebase_project_id }}
      # Asymmetric lane (dev OR prod) fired-and-forgot the rollout — do NOT re-poll the ~7-25-min FAH
      # build here; report the deploy job status immediately. Non-asymmetric repos: true, unchanged.
      wait_for_fah: ${{ !inputs.asymmetric_lanes }}
    secrets: inherit
