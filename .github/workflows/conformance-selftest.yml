name: Conformance Self-Test

# Gates changes to the conformance checkers themselves. The checkers are how AR#5
# rules 1 & 2 become build-failing across the fleet — so their own logic must be
# fixture-tested before it can red (or fail to red) any consumer repo.
# This runs ONLY on shared-workflows PRs that touch the checker suite.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/conformance/**'

jobs:
  conformance-selftest:
    name: conformance-selftest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checker deps
        run: npm ci
      - name: Run checker fixture suite
        run: npm test
