name: Deploy to Firebase

on:
  workflow_call:
    inputs:
      firebase_project_id:
        required: true
        type: string
      deploy_command:
        type: string
        default: 'apphosting'
      app_hosting_backend:
        description: 'Prod FAH backend name. Used when environment=prod, or when environment=dev and dev_backend is empty (legacy auto-suffix path appends "-dev").'
        type: string
        default: ''
      dev_backend:
        description: 'Explicit dev FAH backend name. Used when environment=dev. Overrides the legacy "<app_hosting_backend>-dev" auto-suffix. Required for projects where prod and dev backend names are not the standard <name>/<name>-dev pair (e.g. admin: triarch-dev/admin-dev, darksouls: darksouls-rpg/darksouls-dev).'
        required: false
        type: string
        default: ''
      app_url:
        type: string
        default: ''
      git_branch:
        description: 'Git branch to deploy. Empty or "main" with environment=prod deploys main. Empty or "main" with environment=dev deploys the "dev" branch. Pass a non-default value to override.'
        required: false
        type: string
        default: 'main'
      admin_callback_url:
        description: 'Base URL for admin control plane (admin.triarch.dev). Override for staging/test.'
        required: false
        type: string
        default: 'https://crm.triarchsecurity.com'
      environment:
        description: 'Deployment environment: dev or prod. Default prod for backwards compatibility.'
        required: false
        type: string
        default: 'prod'
      wait_for_rollout:
        description: >
          When true (default), the REST apphosting path polls the rollout to a terminal state so the
          job result reflects the real outcome (prod gates/record-release depend on it). False =
          fire-and-forget: create the build+rollout and return immediately — the asymmetric DEV lane
          uses this (FAH builds server-side ~7 min; polling burned ~8 billed min/push on the runner).
        required: false
        type: boolean
        default: true
    secrets:
      # required:false so the canonical ci-cd.yml can be referenced by repos that
      # never deploy through it (static/FAH-native, e.g. www). GitHub validates
      # required secrets at STARTUP for every referenced reusable workflow even when
      # the job is if-skipped, so a hard requirement here would block those repos.
      # Real deployers still pass the secret via inherit; the deploy step fails
      # clearly at runtime if it is genuinely absent.
      FIREBASE_SA_KEY:
        required: false
      FIREBASE_TOKEN:
        # firebase login:ci refresh token. When set, the firebase CLI uses it instead of
        # the SA-key ADC path, which intermittently fails JWT token-exchange on hosted
        # runners ("Failed to authenticate" — clock-skew sensitive). Refresh-token auth
        # is not JWT-signed so it sidesteps that failure. See shared-workflows#42.
        required: false
      GH_PAT:
        required: false
      ADMIN_API_TOKEN:
        description: 'Per-project Bearer token for admin callback (valued with projects.apiKey from CRDB).'
        required: false
    outputs:
      version:
        description: "Extracted app version from version.ts or version.js"
        value: ${{ jobs.deploy.outputs.version }}

permissions:
  packages: read
  contents: write

jobs:
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize deploys to the SAME backend so two job instances (re-run, duplicate trigger,
    # or a dev+prod overlap) never race `apphosting:rollouts:create` on the same auto-derived
    # build id. cancel-in-progress:false → an in-flight rollout finishes; the next queues behind
    # it instead of colliding (the build-id 409 / "unable to queue" class). Belt-and-suspenders
    # with the per-step transient-409 retry below.
    concurrency:
      group: deploy-firebase-${{ inputs.firebase_project_id }}-${{ inputs.environment }}-${{ inputs.app_hosting_backend }}-${{ inputs.dev_backend }}-${{ inputs.git_branch }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.APP_VERSION }}
    # When FIREBASE_TOKEN is set the firebase CLI prefers it over SA-key ADC. Job-level so
    # every firebase command in this job picks it up. Empty (secret unset) => CLI ignores it
    # and falls back to the SA-key path, so this is a safe per-repo opt-in.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    # v7: NODE_AUTH_TOKEN uses secrets.GITHUB_TOKEN at step-level on
    # "Install project dependencies". Consumer repo must be in the npm
    # package's "Manage Actions access" list. See header comment of
    # quality-gate.yml for the v6→v7 pivot rationale.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # Try version.ts first (Next.js projects), then version.js, then package.json.
          # Fall through to package.json if version.ts/js exists but grep returns empty
          # (e.g. when APP_VERSION is derived from process.env rather than a literal string).
          VER=""
          if [ -f "src/lib/version.ts" ]; then
            VER=$(grep -oP "APP_VERSION\s*=\s*'[^']*'" src/lib/version.ts | grep -oP "'[^']*'" | tr -d "'")
          elif [ -f "public/js/version.js" ]; then
            VER=$(grep -oP "APP_VERSION\s*=\s*'[^']*'" public/js/version.js | grep -oP "'[^']*'" | tr -d "'")
          fi
          if [ -z "$VER" ] && [ -f "package.json" ]; then
            VER=$(node -p "require('./package.json').version" 2>/dev/null)
          fi
          VER="${VER:-unknown}"
          echo "APP_VERSION=$VER" >> $GITHUB_OUTPUT
          echo "Extracted version: $VER"

      # Auth writes the ADC credentials file (create_credentials_file defaults true) so the
      # firebase-tools CLI FALLBACK keeps working. NO token_format here: with a plain SA key,
      # `token_format: access_token` makes auth@v2 call iamcredentials.generateAccessToken on the SA
      # itself, which requires roles/iam.serviceAccountTokenCreator on itself — no consumer project
      # grants that, so the first real deploy on the overhaul 403'd (atlas run 28835715771,
      # 2026-07-06). The REST token is minted below via the RUNNER-PREINSTALLED gcloud instead (no
      # setup-gcloud install — ~3s, no extra IAM). setup-gcloud stays GONE.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Mint GCP access token (preinstalled gcloud; no IAM tokenCreator needed)
        id: gcp_token
        if: inputs.deploy_command == 'apphosting'
        env:
          CREDS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          gcloud auth activate-service-account --key-file="$CREDS_FILE" --quiet
          TOKEN=$(gcloud auth print-access-token)
          if [ -z "$TOKEN" ]; then echo "::error::Failed to mint GCP access token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Node + project deps are needed ONLY by the hosting-functions deploy path (firebase deploy runs
      # the repo's predeploy build). The apphosting path builds SERVER-SIDE from the git commit and
      # needs no local node_modules — its unconditional setup-node/npm ci/firebase-tools installs (the
      # ~min-per-deploy tooling tax on every apphosting repo) are removed. The apphosting REST path uses
      # system node/curl; its CLI fallback installs firebase-tools inline only when it actually fires.
      - name: Set up Node.js (hosting-functions only)
        if: inputs.deploy_command == 'hosting-functions'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'

      - name: Install project dependencies (hosting-functions only)
        if: inputs.deploy_command == 'hosting-functions'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci || npm install

      - name: Deploy via App Hosting (main branch)
        id: deploy_apphosting_main
        if: inputs.deploy_command == 'apphosting' && (inputs.git_branch == '' || inputs.git_branch == 'main')
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          APP_HOSTING_BACKEND: ${{ inputs.app_hosting_backend }}
          DEV_BACKEND: ${{ inputs.dev_backend }}
          INPUT_GIT_BRANCH: ${{ inputs.git_branch }}
          GCP_TOKEN: ${{ steps.gcp_token.outputs.access_token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WAIT_FOR_ROLLOUT: ${{ inputs.wait_for_rollout }}
        run: |
          # v5: resolve backend with explicit dev_backend support (no more "-dev" auto-suffix
          # when the caller has supplied an explicit dev backend name).
          if [ "$ENVIRONMENT" = "dev" ]; then
            if [ -n "$DEV_BACKEND" ]; then
              # Explicit dev_backend wins. Used for projects where prod backend isn't <name> and
              # dev isn't <name>-dev (e.g. admin: prod=triarch-dev, dev=admin-dev).
              BACKEND="$DEV_BACKEND"
            elif [ -n "$APP_HOSTING_BACKEND" ]; then
              # Legacy v4 behavior: auto-suffix "-dev" onto the prod backend.
              BACKEND="${APP_HOSTING_BACKEND}-dev"
            else
              BACKEND="${FIREBASE_PROJECT_ID}-dev"
            fi
          else
            BACKEND="$APP_HOSTING_BACKEND"
            [ -z "$BACKEND" ] && BACKEND="$FIREBASE_PROJECT_ID"
          fi
          # Choose deploy branch: env=dev defaults to 'dev' branch; env=prod defaults to 'main'.
          # Caller-supplied INPUT_GIT_BRANCH overrides — but if INPUT_GIT_BRANCH=='main' AND ENVIRONMENT=='dev',
          # interpret 'main' as the default and switch to 'dev' (RESEARCH §git_branch for dev — Option 2).
          DEPLOY_BRANCH="${INPUT_GIT_BRANCH:-main}"
          if [ "$ENVIRONMENT" = "dev" ] && [ "$DEPLOY_BRANCH" = "main" ]; then
            DEPLOY_BRANCH="dev"
          fi
          echo "Rolling out backend $BACKEND (env=$ENVIRONMENT) in project $FIREBASE_PROJECT_ID"
          # Per-environment yaml selection is handled by Firebase App Hosting at build time:
          # each backend has an Environment Name setting (Console: Backend → Settings → Environment).
          # When set, App Hosting auto-loads apphosting.<env_name>.yaml and merges it over apphosting.yaml.
          # https://firebase.google.com/docs/app-hosting/multiple-environments
          #
          # ── PRIMARY: direct REST (no firebase-tools install; ~min saved per deploy) ──────────────
          # Live-verified against the API discovery doc + a real atlas-dev rollout (2026-07-06): the
          # Rollout.build field is REQUIRED + immutable and the git ref lives on the BUILD, not the
          # rollout — so the CLI's one-shot `--git-branch` is two REST calls: builds.create(codebase)
          # then rollouts.create(build). We deploy the EXACT triggering commit (github.sha), which for a
          # dev/main push equals that branch's HEAD (identical to the CLI's --git-branch latest-commit).
          run_rest_deploy() {
            [ -z "$GCP_TOKEN" ] && { echo "::warning::No GCP access token — REST path unavailable"; return 10; }
            local base="https://firebaseapphosting.googleapis.com/v1"
            # rollouts/builds reject the locations/- wildcard; resolve the backend region via the
            # aggregated backends list (which DOES accept it), defaulting to us-central1.
            local loc
            loc=$(curl -sS --max-time 20 -H "Authorization: Bearer $GCP_TOKEN" \
              "${base}/projects/${FIREBASE_PROJECT_ID}/locations/-/backends" 2>/dev/null \
              | jq -r --arg B "$BACKEND" '.backends[]? | select((.name|split("/")|last)==$B) | .name|split("/")[3]' 2>/dev/null | head -1)
            loc="${loc:-us-central1}"
            local parent="projects/${FIREBASE_PROJECT_ID}/locations/${loc}/backends/${BACKEND}"
            local api="${base}/${parent}"
            local build_id="gha-${RUN_ID}-${RUN_ATTEMPT}"
            local build_name="${parent}/builds/${build_id}"
            echo "REST deploy → parent=$parent build=$build_id commit=$COMMIT_SHA"
            # 1) create the build from the exact commit (buildId is REQUIRED; requestId gives retry-idempotency)
            local bhttp
            bhttp=$(curl -sS --max-time 90 -o /tmp/fah_build.json -w '%{http_code}' \
              -X POST "${api}/builds?buildId=${build_id}&requestId=$(cat /proc/sys/kernel/random/uuid)" \
              -H "Authorization: Bearer $GCP_TOKEN" -H "Content-Type: application/json" \
              -d "{\"source\":{\"codebase\":{\"commit\":\"${COMMIT_SHA}\"}}}")
            if [ "$bhttp" != "200" ] && [ "$bhttp" != "201" ]; then
              if grep -qiE 'already exists' /tmp/fah_build.json; then
                echo "Build ${build_id} already exists (idempotent retry) — reusing."
              else
                echo "::warning::builds.create HTTP $bhttp:"; cat /tmp/fah_build.json; return 10
              fi
            fi
            # 2) create the rollout referencing that build (it waits for the build to be READY).
            #    rolloutId is REQUIRED (HTTP 400 "must provide a rollout id" — atlas run 28835924838);
            #    reuse the gha build id, unique per run attempt. 'already exists' => idempotent retry.
            local rhttp
            rhttp=$(curl -sS --max-time 90 -o /tmp/fah_roll.json -w '%{http_code}' \
              -X POST "${api}/rollouts?rolloutId=${build_id}&requestId=$(cat /proc/sys/kernel/random/uuid)" \
              -H "Authorization: Bearer $GCP_TOKEN" -H "Content-Type: application/json" \
              -d "{\"build\":\"${build_name}\"}")
            if [ "$rhttp" != "200" ] && [ "$rhttp" != "201" ]; then
              if grep -qiE 'already exists' /tmp/fah_roll.json; then
                echo "Rollout ${build_id} already exists (idempotent retry) — polling it."
              else
                echo "::warning::rollouts.create HTTP $rhttp:"; cat /tmp/fah_roll.json; return 10
              fi
            fi
            # fire-and-forget (wait_for_rollout=false, asymmetric DEV lane): the rollout is created and
            # FAH builds server-side — return without burning the runner on an ~8-min poll.
            if [ "$WAIT_FOR_ROLLOUT" != "true" ]; then
              echo "✓ Rollout ${build_id} created (fire-and-forget — wait_for_rollout=false; FAH builds server-side)"
              return 0
            fi
            echo "Rollout created for build ${build_id}; polling to terminal state…"
            # 3) block until terminal so the deploy JOB reflects the real outcome (the CLI blocked; the
            #    prod gates/record-release depend on this job's result). Match OUR rollout by its build
            #    ref. A genuine FAILED/CANCELLED => exit non-zero (NOT a REST-call failure → NO CLI
            #    fallback; a rebuild would just re-fail). Timeout => pass through (notify.yml reports the
            #    final state); atlas FAH builds run ~6-7 min, budget 25 min under the 30-min job cap.
            local start elapsed state rjson blanks
            start=$(date +%s)
            blanks=0
            while true; do
              elapsed=$(( $(date +%s) - start ))
              if [ "$elapsed" -ge 1500 ]; then
                echo "::warning::Rollout still running after ${elapsed}s — not blocking (notify.yml reports final state)"; return 0
              fi
              # GET THE ROLLOUT BY ID. This listed `rollouts?pageSize=10` and picked ours out with
              # `select(.build==$B)` — but the list endpoint is NOT ordered by createTime, so on a
              # backend with any history those ten rows are effectively arbitrary and OUR rollout is
              # not among them. Measured on atlas 2026-08-21: pageSize=10 returned rollouts created
              # 2026-08-17 and 2026-07-05 while the rollout being polled had been created seconds
              # before. `select` matched nothing on every iteration, forever.
              #
              # The rollout is created with `rolloutId=${build_id}`, so its resource name is known
              # exactly. A direct GET removes the ordering assumption rather than making it less wrong.
              rjson=$(curl -sS --max-time 20 -H "Authorization: Bearer $GCP_TOKEN" "${api}/rollouts/${build_id}" 2>/dev/null)
              state=$(printf '%s' "$rjson" | jq -r '.state // empty' 2>/dev/null)
              # AN UNREADABLE STATE IS NOT "PENDING". `${state:-PENDING}` turned "I cannot find it"
              # into "it is still running" — which is exactly what disguised a lookup bug as a slow
              # deploy: the loop ran to its 1500s cap on EVERY push, warned, and returned 0. Measured
              # cost on atlas: deploy-prod 25m33s while the rollout it watched finished in 8m42s.
              if [ -z "$state" ]; then
                blanks=$(( blanks + 1 ))
                if [ "$blanks" -ge 5 ]; then
                  echo "::error::Rollout ${build_id} not readable after ${blanks} attempts (${elapsed}s). Last response:"
                  printf '%s\n' "$rjson" | head -c 400
                  return 1
                fi
                echo "  state=<unreadable> (${blanks}/5) elapsed=${elapsed}s — retrying"; sleep 20; continue
              fi
              blanks=0
              case "$state" in
                STATE_SUCCESS|SUCCESS|SUCCEEDED) echo "✓ Rollout SUCCEEDED in ${elapsed}s"; return 0 ;;
                STATE_FAILED|FAILED|STATE_CANCELLED|CANCELLED) echo "::error::Rollout $state after ${elapsed}s"; return 1 ;;
                *) echo "  state=$state elapsed=${elapsed}s — waiting"; sleep 20 ;;
              esac
            done
          }

          # `|| rc=$?` keeps the default `bash -e` from killing the script on a nonzero return —
          # a bare call exited the step with rc=10 and made the CLI fallback DEAD CODE (atlas run
          # 28835924838: "Process completed with exit code 10", no fallback attempted).
          rc=0
          run_rest_deploy || rc=$?
          if [ "$rc" -eq 1 ]; then
            exit 1   # genuine rollout failure — do NOT fall back (a rebuild re-fails)
          fi
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          # ── FALLBACK: firebase CLI (only reached when the REST *call* could not start; rc=10) ──────
          echo "::warning::REST rollout path unavailable (rc=$rc) — falling back to firebase-tools CLI"
          npm install -g firebase-tools@15.22.2
          # Transient-deploy retry (max 6, linear backoff): retry ONLY the known-transient
          # "Failed to authenticate" blip and the build-id 409 collision; all else fails immediately.
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase apphosting:rollouts:create "$BACKEND" \
              --git-branch "$DEPLOY_BRANCH" \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qiE "Failed to authenticate|builds/build-[0-9-]+' already exists|unable to queue the operation" "$fb_log" && [ "$attempt" -lt 6 ]; then
              echo "::warning::Transient firebase deploy failure (auth blip or build-id collision; attempt ${attempt}/6) — retrying in $((attempt * 45))s"
              rm -f "$fb_log"; sleep $((attempt * 45)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Deploy via App Hosting (branch preview)
        id: deploy_apphosting_branch
        if: inputs.deploy_command == 'apphosting' && inputs.git_branch != '' && inputs.git_branch != 'main'
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          APP_HOSTING_BACKEND: ${{ inputs.app_hosting_backend }}
          GIT_BRANCH: ${{ inputs.git_branch }}
          GCP_TOKEN: ${{ steps.gcp_token.outputs.access_token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          BACKEND="$APP_HOSTING_BACKEND"
          [ -z "$BACKEND" ] && BACKEND="$FIREBASE_PROJECT_ID"
          echo "Rolling out branch '$GIT_BRANCH' to backend $BACKEND in project $FIREBASE_PROJECT_ID"
          # PRIMARY: direct REST (build-from-branch then rollout). A branch preview deploys the LATEST
          # commit on an arbitrary branch (github.sha may be a different ref for a manual dispatch), so
          # this path uses codebase.branch — the exact semantics of the CLI's --git-branch.
          run_rest_deploy() {
            [ -z "$GCP_TOKEN" ] && { echo "::warning::No GCP access token — REST path unavailable"; return 10; }
            local base="https://firebaseapphosting.googleapis.com/v1"
            local loc
            loc=$(curl -sS --max-time 20 -H "Authorization: Bearer $GCP_TOKEN" \
              "${base}/projects/${FIREBASE_PROJECT_ID}/locations/-/backends" 2>/dev/null \
              | jq -r --arg B "$BACKEND" '.backends[]? | select((.name|split("/")|last)==$B) | .name|split("/")[3]' 2>/dev/null | head -1)
            loc="${loc:-us-central1}"
            local parent="projects/${FIREBASE_PROJECT_ID}/locations/${loc}/backends/${BACKEND}"
            local api="${base}/${parent}"
            local build_id="gha-${RUN_ID}-${RUN_ATTEMPT}"
            local build_name="${parent}/builds/${build_id}"
            local bhttp
            bhttp=$(curl -sS --max-time 90 -o /tmp/fah_build.json -w '%{http_code}' \
              -X POST "${api}/builds?buildId=${build_id}&requestId=$(cat /proc/sys/kernel/random/uuid)" \
              -H "Authorization: Bearer $GCP_TOKEN" -H "Content-Type: application/json" \
              -d "{\"source\":{\"codebase\":{\"branch\":\"${GIT_BRANCH}\"}}}")
            if [ "$bhttp" != "200" ] && [ "$bhttp" != "201" ]; then
              if grep -qiE 'already exists' /tmp/fah_build.json; then
                echo "Build ${build_id} already exists (idempotent retry) — reusing."
              else
                echo "::warning::builds.create HTTP $bhttp:"; cat /tmp/fah_build.json; return 10
              fi
            fi
            # rolloutId is REQUIRED (HTTP 400 otherwise); 'already exists' => idempotent retry.
            local rhttp
            rhttp=$(curl -sS --max-time 90 -o /tmp/fah_roll.json -w '%{http_code}' \
              -X POST "${api}/rollouts?rolloutId=${build_id}&requestId=$(cat /proc/sys/kernel/random/uuid)" \
              -H "Authorization: Bearer $GCP_TOKEN" -H "Content-Type: application/json" \
              -d "{\"build\":\"${build_name}\"}")
            if [ "$rhttp" != "200" ] && [ "$rhttp" != "201" ]; then
              if grep -qiE 'already exists' /tmp/fah_roll.json; then
                echo "Rollout ${build_id} already exists (idempotent retry) — polling it."
              else
                echo "::warning::rollouts.create HTTP $rhttp:"; cat /tmp/fah_roll.json; return 10
              fi
            fi
            echo "Rollout created for build ${build_id}; polling to terminal state…"
            local start elapsed state rjson blanks
            start=$(date +%s)
            blanks=0
            while true; do
              elapsed=$(( $(date +%s) - start ))
              if [ "$elapsed" -ge 1500 ]; then
                echo "::warning::Rollout still running after ${elapsed}s — not blocking"; return 0
              fi
              # GET THE ROLLOUT BY ID. This listed `rollouts?pageSize=10` and picked ours out with
              # `select(.build==$B)` — but the list endpoint is NOT ordered by createTime, so on a
              # backend with any history those ten rows are effectively arbitrary and OUR rollout is
              # not among them. Measured on atlas 2026-08-21: pageSize=10 returned rollouts created
              # 2026-08-17 and 2026-07-05 while the rollout being polled had been created seconds
              # before. `select` matched nothing on every iteration, forever.
              #
              # The rollout is created with `rolloutId=${build_id}`, so its resource name is known
              # exactly. A direct GET removes the ordering assumption rather than making it less wrong.
              rjson=$(curl -sS --max-time 20 -H "Authorization: Bearer $GCP_TOKEN" "${api}/rollouts/${build_id}" 2>/dev/null)
              state=$(printf '%s' "$rjson" | jq -r '.state // empty' 2>/dev/null)
              # AN UNREADABLE STATE IS NOT "PENDING". `${state:-PENDING}` turned "I cannot find it"
              # into "it is still running" — which is exactly what disguised a lookup bug as a slow
              # deploy: the loop ran to its 1500s cap on EVERY push, warned, and returned 0. Measured
              # cost on atlas: deploy-prod 25m33s while the rollout it watched finished in 8m42s.
              if [ -z "$state" ]; then
                blanks=$(( blanks + 1 ))
                if [ "$blanks" -ge 5 ]; then
                  echo "::error::Rollout ${build_id} not readable after ${blanks} attempts (${elapsed}s). Last response:"
                  printf '%s\n' "$rjson" | head -c 400
                  return 1
                fi
                echo "  state=<unreadable> (${blanks}/5) elapsed=${elapsed}s — retrying"; sleep 20; continue
              fi
              blanks=0
              case "$state" in
                STATE_SUCCESS|SUCCESS|SUCCEEDED) echo "✓ Rollout SUCCEEDED in ${elapsed}s"; return 0 ;;
                STATE_FAILED|FAILED|STATE_CANCELLED|CANCELLED) echo "::error::Rollout $state after ${elapsed}s"; return 1 ;;
                *) echo "  state=$state elapsed=${elapsed}s — waiting"; sleep 20 ;;
              esac
            done
          }

          # `|| rc=$?` keeps `bash -e` from killing the script on a nonzero return (see main-branch step).
          rc=0
          run_rest_deploy || rc=$?
          [ "$rc" -eq 1 ] && exit 1
          [ "$rc" -eq 0 ] && exit 0

          # FALLBACK: firebase CLI (only when the REST call could not start; rc=10).
          echo "::warning::REST rollout path unavailable (rc=$rc) — falling back to firebase-tools CLI"
          npm install -g firebase-tools@15.22.2
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase apphosting:rollouts:create "$BACKEND" \
              --git-branch "$GIT_BRANCH" \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qiE "Failed to authenticate|builds/build-[0-9-]+' already exists|unable to queue the operation" "$fb_log" && [ "$attempt" -lt 6 ]; then
              echo "::warning::Transient firebase deploy failure (auth blip or build-id collision; attempt ${attempt}/6) — retrying in $((attempt * 45))s"
              rm -f "$fb_log"; sleep $((attempt * 45)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Deploy via Hosting + Functions
        if: inputs.deploy_command == 'hosting-functions'
        run: |
          # firebase-tools is installed inline here (the unconditional global install was removed — the
          # apphosting path no longer needs it). Node + deps came from the hosting-functions-only setup
          # steps above. Transient-auth retry: retry only the "Failed to authenticate" blip.
          npm install -g firebase-tools@15.22.2
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase deploy --non-interactive --force \
              --project ${{ inputs.firebase_project_id }} 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qi "Failed to authenticate" "$fb_log" && [ "$attempt" -lt 6 ]; then
              echo "::warning::Transient firebase auth failure (attempt ${attempt}/6) — retrying in $((attempt * 45))s"
              rm -f "$fb_log"; sleep $((attempt * 45)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Tag deployed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VER="${{ steps.version.outputs.APP_VERSION }}"
          TAG="deploy-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}"
          git tag "$TAG" -m "Deployed $VER from ${{ github.ref_name }} commit ${{ github.sha }}"
          git push origin "$TAG" || echo "::warning::Tag push failed — may need contents:write permission"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project | ${{ inputs.firebase_project_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.APP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify admin (release record)
        id: notify_admin
        continue-on-error: true
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          ADMIN_CALLBACK_URL: ${{ inputs.admin_callback_url }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Pitfall 2: Empty-token guard. GitHub Actions silently substitutes "" for missing secrets.
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::warning::ADMIN_API_TOKEN not set on consumer repo — admin callback skipped. Set this Actions secret to projects.apiKey for this project to enable release tracking."
            echo "## Admin Callback (${ENVIRONMENT})" >> $GITHUB_STEP_SUMMARY
            echo "Skipped: ADMIN_API_TOKEN not set." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Resolve branch: prefer explicit input, fall back to github.ref_name (typically 'main' for push-to-main).
          BRANCH="${{ inputs.git_branch }}"
          [ -z "$BRANCH" ] && BRANCH="${{ github.ref_name }}"

          # Construct deterministic previewUrl. For main branch we send empty (UI hides it); non-main gets the FAH URL pattern.
          PREVIEW_URL=""
          if [ "$BRANCH" != "main" ]; then
            BACKEND="${{ inputs.app_hosting_backend }}"
            [ -z "$BACKEND" ] && BACKEND="${{ inputs.firebase_project_id }}"
            SANITIZED=$(echo "$BRANCH" | tr '/' '-')
            PREVIEW_URL="https://${SANITIZED}--${BACKEND}.us-central1.hosted.app"
          fi

          # Build payload. previewUrl goes inside metadata JSONB per research §previewUrl Storage Decision (D-13).
          # v8 (2026-05-14): env now reflects inputs.environment rather than hardcoded "dev".
          # This fixes the long-standing bug where every deploy — including those targeting prod
          # Firebase backends — was recorded as env=dev in the tracker, hiding real prod versions.
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$PREVIEW_URL" ]; then
            METADATA_JSON="{\"previewUrl\":\"${PREVIEW_URL}\"}"
          else
            METADATA_JSON="{}"
          fi
          PAYLOAD=$(printf '{"version":"%s","releaseType":"patch","env":"%s","commitSha":"%s","deployedAt":"%s","releasedBy":"%s","branch":"%s","metadata":%s}' \
            "${{ steps.version.outputs.APP_VERSION }}" \
            "$ENVIRONMENT" \
            "${{ github.sha }}" \
            "$DEPLOYED_AT" \
            "${{ github.actor }}" \
            "$BRANCH" \
            "$METADATA_JSON")

          # POST + capture body and code separately so a 400 surfaces the error string in the workflow log.
          RESP_BODY=$(mktemp)
          HTTP_CODE=$(curl -s --max-time 10 -o "$RESP_BODY" -w "%{http_code}" \
            -X POST "${ADMIN_CALLBACK_URL}/api/platform/ingest/release-logs" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "Admin ${ENVIRONMENT} callback succeeded (HTTP 201). release_logs row created for ${BRANCH} v${{ steps.version.outputs.APP_VERSION }}."
          else
            RESP_TEXT=$(head -c 500 "$RESP_BODY")
            echo "::warning::Admin ${ENVIRONMENT} callback failed (HTTP $HTTP_CODE) for ${BRANCH} v${{ steps.version.outputs.APP_VERSION }}. Response body: ${RESP_TEXT}"
          fi
          rm -f "$RESP_BODY"

          echo "## Admin Callback (${ENVIRONMENT})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | \`${ADMIN_CALLBACK_URL}/api/platform/ingest/release-logs\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${ENVIRONMENT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | $HTTP_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.APP_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PREVIEW_URL" ]; then
            echo "| Preview URL | $PREVIEW_URL |" >> $GITHUB_STEP_SUMMARY
          fi
