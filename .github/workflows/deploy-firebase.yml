name: Deploy to Firebase

on:
  workflow_call:
    inputs:
      firebase_project_id:
        required: true
        type: string
      deploy_command:
        type: string
        default: 'apphosting'
      app_hosting_backend:
        description: 'Prod FAH backend name. Used when environment=prod, or when environment=dev and dev_backend is empty (legacy auto-suffix path appends "-dev").'
        type: string
        default: ''
      dev_backend:
        description: 'Explicit dev FAH backend name. Used when environment=dev. Overrides the legacy "<app_hosting_backend>-dev" auto-suffix. Required for projects where prod and dev backend names are not the standard <name>/<name>-dev pair (e.g. admin: triarch-dev/admin-dev, darksouls: darksouls-rpg/darksouls-dev).'
        required: false
        type: string
        default: ''
      app_url:
        type: string
        default: ''
      git_branch:
        description: 'Git branch to deploy. Empty or "main" with environment=prod deploys main. Empty or "main" with environment=dev deploys the "dev" branch. Pass a non-default value to override.'
        required: false
        type: string
        default: 'main'
      admin_callback_url:
        description: 'Base URL for admin control plane (admin.triarch.dev). Override for staging/test.'
        required: false
        type: string
        default: 'https://admin.triarch.dev'
      environment:
        description: 'Deployment environment: dev or prod. Default prod for backwards compatibility.'
        required: false
        type: string
        default: 'prod'
    secrets:
      # required:false so the canonical ci-cd.yml can be referenced by repos that
      # never deploy through it (static/FAH-native, e.g. www). GitHub validates
      # required secrets at STARTUP for every referenced reusable workflow even when
      # the job is if-skipped, so a hard requirement here would block those repos.
      # Real deployers still pass the secret via inherit; the deploy step fails
      # clearly at runtime if it is genuinely absent.
      FIREBASE_SA_KEY:
        required: false
      FIREBASE_TOKEN:
        # firebase login:ci refresh token. When set, the firebase CLI uses it instead of
        # the SA-key ADC path, which intermittently fails JWT token-exchange on hosted
        # runners ("Failed to authenticate" — clock-skew sensitive). Refresh-token auth
        # is not JWT-signed so it sidesteps that failure. See shared-workflows#42.
        required: false
      GH_PAT:
        required: false
      ADMIN_API_TOKEN:
        description: 'Per-project Bearer token for admin callback (valued with projects.apiKey from CRDB).'
        required: false
    outputs:
      version:
        description: "Extracted app version from version.ts or version.js"
        value: ${{ jobs.deploy.outputs.version }}

permissions:
  packages: read
  contents: write

jobs:
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.APP_VERSION }}
    # When FIREBASE_TOKEN is set the firebase CLI prefers it over SA-key ADC. Job-level so
    # every firebase command in this job picks it up. Empty (secret unset) => CLI ignores it
    # and falls back to the SA-key path, so this is a safe per-repo opt-in.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    # v7: NODE_AUTH_TOKEN uses secrets.GITHUB_TOKEN at step-level on
    # "Install project dependencies". Consumer repo must be in the npm
    # package's "Manage Actions access" list. See header comment of
    # quality-gate.yml for the v6→v7 pivot rationale.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # Try version.ts first (Next.js projects), then version.js, then package.json.
          # Fall through to package.json if version.ts/js exists but grep returns empty
          # (e.g. when APP_VERSION is derived from process.env rather than a literal string).
          VER=""
          if [ -f "src/lib/version.ts" ]; then
            VER=$(grep -oP "APP_VERSION\s*=\s*'[^']*'" src/lib/version.ts | grep -oP "'[^']*'" | tr -d "'")
          elif [ -f "public/js/version.js" ]; then
            VER=$(grep -oP "APP_VERSION\s*=\s*'[^']*'" public/js/version.js | grep -oP "'[^']*'" | tr -d "'")
          fi
          if [ -z "$VER" ] && [ -f "package.json" ]; then
            VER=$(node -p "require('./package.json').version" 2>/dev/null)
          fi
          VER="${VER:-unknown}"
          echo "APP_VERSION=$VER" >> $GITHUB_OUTPUT
          echo "Extracted version: $VER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install project dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci || npm install

      - name: Install Firebase CLI
        # Pinned (was unpinned `firebase-tools`): an unpinned global install pulls
        # firebase-tools@latest on every deploy across all 7 consumer repos, exposing
        # the whole portfolio to ~daily upstream releases and any regression they ship.
        # Bump deliberately after verifying a newer release deploys cleanly.
        run: npm install -g firebase-tools@15.22.2

      - name: Deploy via App Hosting (main branch)
        id: deploy_apphosting_main
        if: inputs.deploy_command == 'apphosting' && (inputs.git_branch == '' || inputs.git_branch == 'main')
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          APP_HOSTING_BACKEND: ${{ inputs.app_hosting_backend }}
          DEV_BACKEND: ${{ inputs.dev_backend }}
          INPUT_GIT_BRANCH: ${{ inputs.git_branch }}
        run: |
          # v5: resolve backend with explicit dev_backend support (no more "-dev" auto-suffix
          # when the caller has supplied an explicit dev backend name).
          if [ "$ENVIRONMENT" = "dev" ]; then
            if [ -n "$DEV_BACKEND" ]; then
              # Explicit dev_backend wins. Used for projects where prod backend isn't <name> and
              # dev isn't <name>-dev (e.g. admin: prod=triarch-dev, dev=admin-dev).
              BACKEND="$DEV_BACKEND"
            elif [ -n "$APP_HOSTING_BACKEND" ]; then
              # Legacy v4 behavior: auto-suffix "-dev" onto the prod backend.
              BACKEND="${APP_HOSTING_BACKEND}-dev"
            else
              BACKEND="${FIREBASE_PROJECT_ID}-dev"
            fi
          else
            BACKEND="$APP_HOSTING_BACKEND"
            [ -z "$BACKEND" ] && BACKEND="$FIREBASE_PROJECT_ID"
          fi
          # Choose deploy branch: env=dev defaults to 'dev' branch; env=prod defaults to 'main'.
          # Caller-supplied INPUT_GIT_BRANCH overrides — but if INPUT_GIT_BRANCH=='main' AND ENVIRONMENT=='dev',
          # interpret 'main' as the default and switch to 'dev' (RESEARCH §git_branch for dev — Option 2).
          DEPLOY_BRANCH="${INPUT_GIT_BRANCH:-main}"
          if [ "$ENVIRONMENT" = "dev" ] && [ "$DEPLOY_BRANCH" = "main" ]; then
            DEPLOY_BRANCH="dev"
          fi
          echo "Rolling out branch '$DEPLOY_BRANCH' to backend $BACKEND (env=$ENVIRONMENT) in project $FIREBASE_PROJECT_ID"
          # Per-environment yaml selection is handled by Firebase App Hosting at build time:
          # each backend has an Environment Name setting (Console: Backend → Settings → Environment).
          # When set, App Hosting auto-loads apphosting.<env_name>.yaml and merges it over apphosting.yaml.
          # https://firebase.google.com/docs/app-hosting/multiple-environments
          # Transient-deploy retry (max 3, linear backoff). Retry ONLY two known transient
          # firebase-tools failures; exit immediately on everything else (preserves prior behavior):
          #   1. "Failed to authenticate" — firebase-tools intermittently aborts its internal
          #      SA-key token exchange BEFORE any API call (clock-skew/version blip). Pre-rollout,
          #      so retrying creates no duplicate.
          #   2. build-id 409 ("...builds/build-<date>-NNN already exists") — apphosting:rollouts:create
          #      auto-derives a date-sequenced build id that can collide with an existing/in-flight
          #      same-day build (notably after a failed build leaves the id taken — e.g. the
          #      2026-06-27 tmi-dev incident: a missing secret-accessor grant failed the build,
          #      then every redeploy 409'd on the orphaned id). A fresh invocation derives the next
          #      id, so the retry converges. May create one extra build rolling out the same commit
          #      (harmless, last-wins) — acceptable vs. a wedged deploy.
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase apphosting:rollouts:create "$BACKEND" \
              --git-branch "$DEPLOY_BRANCH" \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qiE "Failed to authenticate|builds/build-[0-9-]+' already exists" "$fb_log" && [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient firebase deploy failure (auth blip or build-id collision; attempt ${attempt}/3) — retrying in $((attempt * 20))s"
              rm -f "$fb_log"; sleep $((attempt * 20)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Deploy via App Hosting (branch preview)
        id: deploy_apphosting_branch
        if: inputs.deploy_command == 'apphosting' && inputs.git_branch != '' && inputs.git_branch != 'main'
        run: |
          BACKEND="${{ inputs.app_hosting_backend }}"
          [ -z "$BACKEND" ] && BACKEND="${{ inputs.firebase_project_id }}"
          echo "Rolling out branch '${{ inputs.git_branch }}' to backend $BACKEND in project ${{ inputs.firebase_project_id }}"
          # Transient-deploy retry (see "main branch" step for full rationale): retry the
          # "Failed to authenticate" blip AND the build-id 409 collision; all other errors
          # fail immediately as before.
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase apphosting:rollouts:create "$BACKEND" \
              --git-branch "${{ inputs.git_branch }}" \
              --project ${{ inputs.firebase_project_id }} \
              --non-interactive 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qiE "Failed to authenticate|builds/build-[0-9-]+' already exists" "$fb_log" && [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient firebase deploy failure (auth blip or build-id collision; attempt ${attempt}/3) — retrying in $((attempt * 20))s"
              rm -f "$fb_log"; sleep $((attempt * 20)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Deploy via Hosting + Functions
        if: inputs.deploy_command == 'hosting-functions'
        run: |
          # Transient-auth retry (see "main branch" step for rationale): retry only the
          # "Failed to authenticate" blip; all other errors fail immediately as before.
          attempt=1
          while true; do
            fb_log=$(mktemp)
            set +e
            firebase deploy --non-interactive --force \
              --project ${{ inputs.firebase_project_id }} 2>&1 | tee "$fb_log"
            fb_status=${PIPESTATUS[0]}
            set -e
            [ "$fb_status" -eq 0 ] && { rm -f "$fb_log"; break; }
            if grep -qi "Failed to authenticate" "$fb_log" && [ "$attempt" -lt 3 ]; then
              echo "::warning::Transient firebase auth failure (attempt ${attempt}/3) — retrying in $((attempt * 20))s"
              rm -f "$fb_log"; sleep $((attempt * 20)); attempt=$((attempt + 1)); continue
            fi
            rm -f "$fb_log"; exit "$fb_status"
          done

      - name: Tag deployed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VER="${{ steps.version.outputs.APP_VERSION }}"
          TAG="deploy-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}"
          git tag "$TAG" -m "Deployed $VER from ${{ github.ref_name }} commit ${{ github.sha }}"
          git push origin "$TAG" || echo "::warning::Tag push failed — may need contents:write permission"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project | ${{ inputs.firebase_project_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.APP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify admin (release record)
        id: notify_admin
        continue-on-error: true
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          ADMIN_CALLBACK_URL: ${{ inputs.admin_callback_url }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Pitfall 2: Empty-token guard. GitHub Actions silently substitutes "" for missing secrets.
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::warning::ADMIN_API_TOKEN not set on consumer repo — admin callback skipped. Set this Actions secret to projects.apiKey for this project to enable release tracking."
            echo "## Admin Callback (${ENVIRONMENT})" >> $GITHUB_STEP_SUMMARY
            echo "Skipped: ADMIN_API_TOKEN not set." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Resolve branch: prefer explicit input, fall back to github.ref_name (typically 'main' for push-to-main).
          BRANCH="${{ inputs.git_branch }}"
          [ -z "$BRANCH" ] && BRANCH="${{ github.ref_name }}"

          # Construct deterministic previewUrl. For main branch we send empty (UI hides it); non-main gets the FAH URL pattern.
          PREVIEW_URL=""
          if [ "$BRANCH" != "main" ]; then
            BACKEND="${{ inputs.app_hosting_backend }}"
            [ -z "$BACKEND" ] && BACKEND="${{ inputs.firebase_project_id }}"
            SANITIZED=$(echo "$BRANCH" | tr '/' '-')
            PREVIEW_URL="https://${SANITIZED}--${BACKEND}.us-central1.hosted.app"
          fi

          # Build payload. previewUrl goes inside metadata JSONB per research §previewUrl Storage Decision (D-13).
          # v8 (2026-05-14): env now reflects inputs.environment rather than hardcoded "dev".
          # This fixes the long-standing bug where every deploy — including those targeting prod
          # Firebase backends — was recorded as env=dev in the tracker, hiding real prod versions.
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$PREVIEW_URL" ]; then
            METADATA_JSON="{\"previewUrl\":\"${PREVIEW_URL}\"}"
          else
            METADATA_JSON="{}"
          fi
          PAYLOAD=$(printf '{"version":"%s","releaseType":"patch","env":"%s","commitSha":"%s","deployedAt":"%s","releasedBy":"%s","branch":"%s","metadata":%s}' \
            "${{ steps.version.outputs.APP_VERSION }}" \
            "$ENVIRONMENT" \
            "${{ github.sha }}" \
            "$DEPLOYED_AT" \
            "${{ github.actor }}" \
            "$BRANCH" \
            "$METADATA_JSON")

          # POST + capture body and code separately so a 400 surfaces the error string in the workflow log.
          RESP_BODY=$(mktemp)
          HTTP_CODE=$(curl -s --max-time 10 -o "$RESP_BODY" -w "%{http_code}" \
            -X POST "${ADMIN_CALLBACK_URL}/api/platform/ingest/release-logs" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")

          if [ "$HTTP_CODE" = "201" ]; then
            echo "Admin ${ENVIRONMENT} callback succeeded (HTTP 201). release_logs row created for ${BRANCH} v${{ steps.version.outputs.APP_VERSION }}."
          else
            RESP_TEXT=$(head -c 500 "$RESP_BODY")
            echo "::warning::Admin ${ENVIRONMENT} callback failed (HTTP $HTTP_CODE) for ${BRANCH} v${{ steps.version.outputs.APP_VERSION }}. Response body: ${RESP_TEXT}"
          fi
          rm -f "$RESP_BODY"

          echo "## Admin Callback (${ENVIRONMENT})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | \`${ADMIN_CALLBACK_URL}/api/platform/ingest/release-logs\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${ENVIRONMENT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | $HTTP_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.APP_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PREVIEW_URL" ]; then
            echo "| Preview URL | $PREVIEW_URL |" >> $GITHUB_STEP_SUMMARY
          fi
